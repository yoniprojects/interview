<body>

<script>
var KEY='visaprep-data',UKEY='visaprep-user',NAMES=['Tom','Yoni'];
var S={questions:[],tests:[],tech:[]},user=null,tab='home',run=null,histWho=null,adding=false,bulk=null,trun=null;
try{var d=localStorage.getItem(KEY);if(d)S=JSON.parse(d);user=localStorage.getItem(UKEY)}catch(e){}
if(NAMES.indexOf(user)<0)user=null;
S.questions=S.questions||[];S.tests=S.tests||[];S.tech=S.tech||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===== FIREBASE: paste your config values between the quotes ===== */
var FB_CONFIG={apiKey:"AIzaSyBksmxT9fDiBcgZiMmWCvIX_wlZmmWxp3g",authDomain:"interview-3159b.firebaseapp.com",projectId:"interview-3159b",storageBucket:"interview-3159b.firebasestorage.app",messagingSenderId:"21118639682",appId:"1:21118639682:web:68ad7679a8113cc99bd7db"};
/* ================================================================= */
var anim=false,lastJ={},shownSync='',db=null,sync='off',first={q:true,t:true,k:true};
function fbErr(e){sync='err';console.error(e);softRender()}
function cQ(q){if(db)db.collection('visaprep_questions').doc(q.id).set({text:q.text,by:q.by||'',answers:q.answers||{},about:q.about||'',archived:!!q.archived,created:q.created||Date.now()}).catch(fbErr)}
function cK(f){if(db)db.collection('visaprep_tech').doc(f.id).set({text:f.text,answer:f.answer,by:f.by||'',created:f.created||Date.now()}).catch(fbErr)}
function cT(t){if(db)db.collection('visaprep_tests').doc(t.id).set(t).catch(fbErr)}
function rr(k,arr){var j=JSON.stringify(arr),ch=lastJ[k]!==j||shownSync!==sync;lastJ[k]=j;shownSync=sync;if(ch)softRender()}
function softRender(){
  if(bulk)return;
  var el=document.activeElement,id=el&&el.id,ss=el&&el.selectionStart,se=el&&el.selectionEnd,vals={};
  document.querySelectorAll('textarea,input').forEach(function(t){if(t.id)vals[t.id]=t.value});
  render();
  for(var k in vals){var t=$(k);if(t)t.value=vals[k]}
  if(id&&$(id)){$(id).focus();try{$(id).setSelectionRange(ss,se)}catch(e){}}
}
function initFB(){
  if(!FB_CONFIG.apiKey||typeof firebase==='undefined')return;
  try{
    firebase.initializeApp(FB_CONFIG);db=firebase.firestore();
    db.collection('visaprep_questions').onSnapshot(function(snap){
      var arr=[];snap.forEach(function(d){var x=d.data();x.id=d.id;x.answers=x.answers||{};arr.push(x)});
      if(snap.metadata.fromCache&&!arr.length)return;
      if(first.q&&!arr.length&&S.questions.length){S.questions.forEach(function(q,i){q.created=q.created||Date.now()+i;cQ(q)})}
      else{arr.sort(function(a,b){return (a.created||0)-(b.created||0)});S.questions=arr}
      first.q=false;sync='live';save();rr('q',arr);
    },fbErr);
    db.collection('visaprep_tests').onSnapshot(function(snap){
      var arr=[];snap.forEach(function(d){var x=d.data();x.id=d.id;arr.push(x)});
      if(snap.metadata.fromCache&&!arr.length)return;
      if(first.t&&!arr.length&&S.tests.length){S.tests.forEach(cT)}
      else{arr.sort(function(a,b){return a.date<b.date?-1:1});S.tests=arr}
      first.t=false;save();rr('t',arr);
    },fbErr);
    db.collection('visaprep_tech').onSnapshot(function(snap){
      var arr=[];snap.forEach(function(d){var x=d.data();x.id=d.id;arr.push(x)});
      if(snap.metadata.fromCache&&!arr.length)return;
      if(first.k&&!arr.length&&S.tech.length){S.tech.forEach(function(f,i){f.created=f.created||Date.now()+i;cK(f)})}
      else{arr.sort(function(a,b){return (a.created||0)-(b.created||0)});S.tech=arr}
      first.k=false;save();rr('k',arr);
    },fbErr);
  }catch(e){fbErr(e)}
}

function other(){return user==='Tom'?'Yoni':'Tom'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(id){return document.getElementById(id)}
function getQ(id){return S.questions.filter(function(x){return x.id===id})[0]}

function render(){

function has(q,n){return !!(q.answers[n]||'').trim()}
function anyAns(q){return q.about?has(q,q.about):(has(q,'Tom')||has(q,'Yoni'))}
function refAns(q,taker){if(q.about)return q.answers[q.about]||'';var o=taker==='Tom'?'Yoni':'Tom';return has(q,o)?q.answers[o]:(q.answers[taker]||'')}
function qCard(q,o){
  var theirs=q.answers[o]||'',sub=q.about&&q.about!==user,tg=sub?'About '+q.about:q.about?'About you':'';
  var byPartner=!q.about&&has(q,o)&&!has(q,user);
  if(!sub)tg+=(tg&&anyAns(q)?' · ':'')+(anyAns(q)?(byPartner?'Answered by '+o:'Answered'):(tg?'':'To answer'));
  var sel='<select onchange="setAbout(\''+q.id+'\',this.value)" aria-label="Who is it about"><option value="">About both</option>'+NAMES.map(function(n){return '<option value="'+n+'"'+(q.about===n?' selected':'')+'>About '+n+'</option>'}).join('')+'</select>';
  var dup=q.about?'<button class="s" onclick="dupBoth(\''+q.id+'\')">Duplicate to both</button>':'';
  return '<div class="card rb'+(anyAns(q)||sub?' done':'')+'"><span class="tag">'+tg+'</span><div class="qt">'+esc(q.text)+'</div>'
  +(sub?'<p class="mu" style="margin:0">Only '+q.about+' answers this one — you’ll be tested on it.</p>':(byPartner?'<p class="mu" style="margin:0 0 8px">'+o+' already answered this — one answer is enough, and you’ll both be tested against it.</p>':'')+'<div class="lbl">Your answer'+(byPartner?' (optional)':'')+'</div><textarea id="a'+q.id+'" placeholder="Write your answer…">'+esc(q.answers[user]||'')+'</textarea>')
  +'<div class="row">'+(sub?'':'<button class="b" onclick="saveA(\''+q.id+'\',this)">Save answer</button>')+'<button class="s" onclick="editQ(\''+q.id+'\')">Edit question</button><button class="s" onclick="archQ(\''+q.id+'\',true)">Archive</button><button class="s" onclick="delQ(\''+q.id+'\')">Delete</button>'+sel+dup+'</div>'
  +(q.about&&!sub?'':'<details'+(byPartner?' open':'')+'><summary>'+o+'’s answer'+(theirs?'':' (none yet)')+'</summary><div class="box">'+(theirs?esc(theirs):'—')+'</div></details>')+'</div>';
}
function qHead(t,n){return '<div class="row sp" style="margin:16px 4px 0"><b>'+t+'</b><span class="mu">'+n+'</span></div>'}
function viewQ(){
  var v=$('view'),o=other(),h='';
  var act=S.questions.filter(function(q){return !q.archived}),arc=S.questions.filter(function(q){return q.archived});
  var sub=function(q){return q.about&&q.about!==user},ans=function(q){return anyAns(q)};
  var todo=act.filter(function(q){return !sub(q)&&!ans(q)}),
      done=act.filter(function(q){return !sub(q)&&ans(q)}),
      theirsQ=act.filter(sub);
  if(!S.questions.length)h='<div class="card full"><b>No questions yet.</b><p class="mu">Tap the + to paste in your list.</p></div>';
  else{
    h='<div class="card full" style="padding:12px 18px"><div class="row sp" style="margin:0"><span class="mu">'+act.length+' active question'+(act.length===1?'':'s')+'</span><button class="s" onclick="bulk=\'q\';render()">✏️ Edit all questions</button></div></div>';
    h+=qHead('To answer',todo.length);
    h+=todo.length?todo.map(function(q){return qCard(q,o)}).join(''):'<div class="card full"><p class="mu" style="margin:0">All caught up 🎉</p></div>';
    if(done.length)h+=qHead('Answered',done.length)+done.map(function(q){return qCard(q,o)}).join('');
    if(theirsQ.length)h+=qHead('About '+o+' only',theirsQ.length)+theirsQ.map(function(q){return qCard(q,o)}).join('');
    if(arc.length){
      h+='<details class="card full" style="margin-top:16px"><summary><b>Archived</b> <span class="mu">('+arc.length+')</span></summary>'
      +arc.map(function(q){
        return '<div style="padding:12px 0;border-top:1px solid rgba(140,100,70,.15);margin-top:10px"><div class="qt">'+esc(q.text)+'</div><div class="mu" style="font-size:.85rem">'+(q.about?'About '+q.about:'About both')+'</div><div class="row"><button class="b" onclick="archQ(\''+q.id+'\',false)">Restore</button><button class="s" onclick="editQ(\''+q.id+'\')">Edit question</button><button class="s" onclick="delQ(\''+q.id+'\')">Delete</button></div></div>'
      }).join('')+'</details>';
    }
  }
  v.innerHTML=h;
}
function archQ(id,f){var q=getQ(id);q.archived=!!f;save();if(db)db.collection('visaprep_questions').doc(id).update({archived:!!f}).catch(fbErr);render()}

function col(k){return k==='q'?'visaprep_questions':'visaprep_tech'}

  var mine=S.tests.filter(function(t){return t.user===user}).sort(function(a,b){return a.date<b.date?-1:1}),
  r={n:mine.length,all:0,ok:0,secs:0,qa:0,qo:0,ta:0,to:0,series:[],miss:{}};
  mine.forEach(function(t){
    var ok=0,tech=t.kind==='tech';
    t.items.forEach(function(x){
      if(x.ok)ok++;
      if(tech){r.to++;if(x.ok)r.ta++}else{r.qo++;if(x.ok)r.qa++}
      if(!x.ok){var k=(tech?'t':'q')+x.qid;(r.miss[k]=r.miss[k]||{q:x.q,n:0,t:tech}).n++}
    });
    r.all+=t.items.length;r.ok+=ok;
    if(tech)r.secs+=t.secs||0;
    if(t.items.length)r.series.push({d:t.date,p:Math.round(ok/t.items.length*100)});
  });
  r.pct=pc(r.ok,r.all);
  return r;
}
function homeHead(){
  var hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening',m=myStats();
  return [g+', '+user+' 👋',!m.n?'Let’s get started — write your answers, then practice.':m.pct>=70?'You’re on track! Keep going.':'Keep practicing — every round helps.'];
}
function trend(s){
  if(s.length<2)return '<p class="mu" style="margin:24px 0">Complete at least two tests to see your trend.</p>';
  s=s.slice(-12);
  var W=400,n=s.length,px=30,Y=function(p){return 14+(100-p)*1.2},
  pts=s.map(function(x,i){return [px+i*(W-px-12)/(n-1),Y(x.p)]}),
  line=pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' '),
  area='M'+pts[0][0].toFixed(1)+',134 L '+line.replace(/ /g,' L ')+' L '+pts[n-1][0].toFixed(1)+',134 Z',
  dl=function(d){return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short'})},
  o='<svg viewBox="0 0 400 170" style="width:100%;height:auto" role="img" aria-label="Accuracy per test"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F9A84" stop-opacity=".28"/><stop offset="1" stop-color="#4F9A84" stop-opacity="0"/></linearGradient></defs>';
  [0,50,100].forEach(function(v){o+='<line x1="'+px+'" x2="396" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#EADFD2" stroke-dasharray="3 4"/><text x="0" y="'+(Y(v)+4)+'" font-size="10" fill="#9A8478" font-weight="700">'+v+'%</text>'});
  o+='<path d="'+area+'" fill="url(#ga)"/><polyline points="'+line+'" fill="none" stroke="#4F9A84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(q,i){o+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(i===n-1?5.5:4)+'" fill="'+(i===n-1?'#EE6A5B':'#fff')+'" stroke="#4F9A84" stroke-width="2.5"/>'});
  o+='<text x="'+px+'" y="162" font-size="10" fill="#9A8478" font-weight="700">'+dl(s[0].d)+'</text><text x="396" y="162" font-size="10" fill="#9A8478" font-weight="700" text-anchor="end">'+dl(s[n-1].d)+'</text></svg>';
  return o;
}
function viewHome(){
  var v=$('view'),m=myStats(),
  mineQ=S.questions.filter(function(q){return !q.archived&&(!q.about||q.about===user)}),
  done=mineQ.filter(anyAns).length,
  facts=S.tech.filter(function(f){return f.answer}).length,
  C=2*Math.PI*52,
  miss=Object.keys(m.miss).map(function(k){return m.miss[k]}).sort(function(a,b){return b.n-a.n}).slice(0,5),
  bars=[['Answers written',pc(done,mineQ.length)],['Question practice',pc(m.qa,m.qo)],['Speed-round accuracy',pc(m.ta,m.to)],['Facts with answers',pc(facts,S.tech.length)]],
  left=mineQ.length-done,h='<div class="dash">';
  h+='<div class="card stat m2"><div class="donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#EADFD2" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="#4F9A84" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*m.pct/100).toFixed(1)+' '+C.toFixed(1)+'"/></svg><div class="c"><b>'+m.pct+'%</b><span>Overall progress</span></div></div></div>';
  h+='<div class="card stat"><div class="ico" style="background:#DDEBDD;color:#3F7A5A">'+ic(IC.p)+'</div><div class="num">'+m.n+'</div><div class="lab">Practice sessions</div></div>';
  h+='<div class="card stat"><div class="ico" style="background:#FCE4D6;color:#E0683A">'+ic(IC.t)+'</div><div class="num">'+fmtT(m.secs)+'</div><div class="lab">Speed-round time</div></div>';
  h+='<div class="card m2 d2"><div class="ct">Your progress</div>'+trend(m.series)+'</div>';
  h+='<div class="card m2"><div class="ct">Focus areas</div>'+bars.map(function(b){return '<div class="bar"><div class="r"><span>'+b[0]+'</span><span>'+b[1]+'%</span></div><div class="tr"><div class="fl" style="width:'+b[1]+'%"></div></div></div>'}).join('')+'</div>';
  h+='<div class="card m2 d2"><div class="ct">Needs review</div>'+(miss.length?miss.map(function(x){return '<div class="miss"><span>'+esc(x.q)+'</span><span class="res" style="background:var(--red);white-space:nowrap">'+x.n+'× missed</span></div>'}).join(''):'<p class="mu" style="margin:0">Nothing to review yet — missed questions will show up here.</p>')+'</div>';
  h+='<div class="card m2"><div class="ct">Next steps</div><p class="mu" style="margin:0 0 4px">'+(left?left+' question'+(left>1?'s':'')+' still need your answer.':'All your answers are written 🎉')+'</p><div class="row"><button class="b" onclick="setTab(\'p\')">Start practice</button><button class="s" onclick="setTab(\''+(left?'q':'t')+'\')">'+(left?'Write answers':'Speed round')+'</button></div></div>';
  v.innerHTML=h+'</div>';
}
initFB();
render();
</script>
