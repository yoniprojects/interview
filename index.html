.app{z-index:1}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body);min-height:100vh}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding:0 0 120px}
.hero{margin:calc(14px + env(safe-area-inset-top,0px)) 14px 0;border-radius:32px;padding:18px 20px 30px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(165deg,#F6A640 0%,#F08A48 16%,#E8615F 38%,#C45A9A 60%,#7C6BC8 80%,#4FA3C7 100%);box-shadow:var(--sh);min-height:190px}
.hero .top{display:flex;align-items:center;gap:8px}
.hero .hi{font-weight:800;flex:1}
.av{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--red);display:grid;place-items:center;font-weight:800}
.hero h1{font:800 2.1rem/1.1 var(--disp);margin:24px 0 6px;text-shadow:0 1px 8px rgba(120,40,40,.2)}
.hero p{margin:0;max-width:calc(100% - 110px)}
.stack{position:absolute;right:12px;bottom:-4px;width:116px;pointer-events:none}
.sheet{margin:16px 14px 0;position:relative}
.card{background:var(--cream);border-radius:26px;padding:18px;margin:12px 0;position:relative;overflow:hidden;box-shadow:var(--sh)}
.rb::after{content:"";position:absolute;right:20px;top:0;width:18px;height:34px;background:var(--amber);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.rb.done::after{background:var(--green)}
.rb .tag{margin-right:40px}
.tag{display:inline-block;background:#F9DDD3;color:#C4493E;border-radius:99px;padding:5px 14px;font-weight:800;font-size:.82rem}
.qt{font-weight:800;font-size:1.1rem;margin:10px 0 12px;position:relative}
.lbl{font-size:.82rem;color:var(--mu);font-weight:700;margin:8px 0 4px}
select{font:700 .85rem var(--body);color:var(--ink);background:var(--cream2);border:0;border-radius:99px;padding:8px 12px;cursor:pointer}
.brow select{flex:none}
textarea,input{width:100%;font:inherit;background:var(--cream2);color:var(--ink);border:2px solid transparent;border-radius:18px;padding:12px 14px}
textarea:focus,input:focus{outline:none;border-color:var(--orange)}
textarea{min-height:90px;resize:vertical}
button{font:800 .95rem var(--body);cursor:pointer;border:0;border-radius:99px;padding:12px 22px;background:var(--cream2);color:var(--ink);transition:transform .12s}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.chip{background:rgba(255,255,255,.26);color:#fff;padding:8px 14px;font-size:.85rem;display:inline-block;border-radius:99px;font-weight:700}
.b{background:var(--orange);color:#fff;box-shadow:0 6px 14px rgba(238,106,91,.35)}.bo{background:var(--green);color:#fff}.bn{background:var(--red);color:#fff}
.s{padding:8px 15px;font-size:.84rem;background:var(--cream2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.sp{justify-content:space-between}
details summary{cursor:pointer;color:var(--mu);font-weight:700;margin-top:12px}
.box{background:var(--cream2);border-radius:18px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin-top:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:460px){.cmp{grid-template-columns:1fr}}
.big{color:#fff;border-radius:30px;padding:24px;margin:12px 0;position:relative;overflow:hidden;box-shadow:var(--sh)}
.big h2{font:800 1.7rem/1.15 var(--disp);margin:12px 0 8px}
.big label{display:block;font-weight:700;font-size:.9rem;margin-top:6px}
.big input,.big textarea{background:#FFFAF4;margin-top:6px}
.big .tag{background:rgba(255,255,255,.28);color:#fff}
.big .b{background:var(--cream);color:var(--red);box-shadow:none}
.big button:not(.b):not(.bo):not(.bn){background:rgba(255,255,255,.26);color:#fff}
.big .box{color:var(--ink);background:#FFFAF4}
.red{background:linear-gradient(160deg,#F6A640,#EE6A5B 45%,#C45A9A)}.blue{background:linear-gradient(160deg,#C45A9A,#7C6BC8 50%,#4FA3C7)}.grn{background:linear-gradient(160deg,#F6C445,#6CB38F 50%,#3F8A82)}
.seg{display:flex;background:var(--cream2);border-radius:99px;padding:5px;gap:4px;margin:4px 0 8px}.seg button{flex:1;background:none;color:var(--mu)}.seg .on{background:var(--orange);color:#fff}
.res{display:inline-block;border-radius:99px;padding:4px 12px;color:#fff;font-weight:800;font-size:.8rem}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--cream);border-radius:99px;padding:8px;display:flex;gap:4px;box-shadow:0 10px 30px rgba(120,80,50,.25);z-index:5}
.nav button{background:none;color:var(--mu);padding:12px 16px;display:flex;gap:8px;align-items:center}
.nav button.on{background:var(--orange);color:#fff;box-shadow:0 6px 14px rgba(238,106,91,.35)}.nav span{font-size:.9rem}.nav button:not(.on) span{display:none}
.fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50% - 262px));width:58px;height:58px;padding:0;border-radius:50%;background:var(--orange);color:#fff;font-size:2rem;line-height:1;box-shadow:0 8px 20px rgba(238,106,91,.5);z-index:5}
.modal{position:fixed;inset:0;background:rgba(63,46,42,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.modal .in{background:var(--cream);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.landing .hero{padding:44px 22px 120px}
.landing .hero h1{font-size:2.5rem;margin:22px 0 10px}
.landing .hero p{max-width:30ch}
.landing .stack{width:132px}
.who{display:grid;gap:12px;margin:16px 0 4px}.who button{font-size:1.15rem;padding:16px 18px;text-align:left;display:flex;align-items:center;gap:14px;color:#fff}
.who i{font:800 1.3rem var(--disp);font-style:normal;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cream);color:var(--ink)}
.who .t{background:var(--blue)}.who .y{background:var(--orange)}
.feat{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px;color:var(--mu);font-size:.95rem}
.feat b{color:var(--ink)}
.mu{color:var(--mu)}
.brand,.side{display:none}
.brow{display:flex;gap:6px;margin:6px 0}.brow input{flex:1;min-width:0}.brow.rm input{text-decoration:line-through;opacity:.4}
.modal .in.wide{max-height:88vh;overflow:auto}
@media (min-width:900px){
.app{max-width:none;margin:0;padding:0 0 60px 256px}
.app:has(.landing){padding-left:0}
.hero .top{display:none}
.hero{margin:20px 28px 0;padding:36px 40px 40px;min-height:170px}
.hero h1{font-size:2.8rem;margin:0 0 6px}.hero p{max-width:60ch;font-size:1.05rem}
.stack{width:140px;right:36px}
.sheet{margin:18px 28px 0}
.t-q,.t-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0 18px;align-items:start}
.full{grid-column:1/-1}
.t-p .big{max-width:680px}
.nav{left:14px;top:14px;bottom:14px;transform:none;width:228px;border-radius:30px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.brand b{width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font:800 1.3rem var(--disp)}
.brand span{font:800 1rem/1.15 var(--body);color:var(--ink)}
.nav button{width:100%;justify-content:flex-start;padding:14px 18px}
.nav button span{display:inline!important;font-size:1rem}
.nav button:hover:not(.on){background:var(--cream2)}
.side{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding:16px 8px 0;border-top:1px solid #ECDFD2;color:var(--ink)}
.side .mu{font-size:.85rem}
.nav .side button{width:auto;align-self:flex-start;padding:8px 16px;font-size:.85rem;background:var(--cream2);color:var(--ink);justify-content:center}
.fab{right:48px;bottom:36px}
.modal{align-items:center}
.modal .in{border-radius:30px;max-width:520px;padding:28px}
.modal .in.wide{max-width:760px}
.landing .hero{margin:56px auto 0;max-width:560px;padding:48px 28px 120px}
.landing .hero h1{font-size:2.6rem}
.landing .sheet{max-width:560px;margin:16px auto 0}
}
@media (prefers-reduced-motion:no-preference){.anim .card,.anim .big{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="app" id="app"></div>
<script>
var KEY='visaprep-data',UKEY='visaprep-user',NAMES=['Tom','Yoni'];
var S={questions:[],tests:[],tech:[]},user=null,tab='q',run=null,histWho=null,adding=false,bulk=null,trun=null;
try{var d=localStorage.getItem(KEY);if(d)S=JSON.parse(d);user=localStorage.getItem(UKEY)}catch(e){}
if(NAMES.indexOf(user)<0)user=null;
S.questions=S.questions||[];S.tests=S.tests||[];S.tech=S.tech||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===== FIREBASE: paste your config values between the quotes ===== */
var FB_CONFIG={apiKey:"AIzaSyBksmxT9fDiBcgZiMmWCvIX_wlZmmWxp3g",authDomain:"interview-3159b.firebaseapp.com",projectId:"interview-3159b",storageBucket:"interview-3159b.firebasestorage.app",messagingSenderId:"21118639682",appId:"1:21118639682:web:68ad7679a8113cc99bd7db"};
/* ================================================================= */
var anim=false,lastJ={},shownSync='',db=null,sync='off',first={q:true,t:true,k:true};
function fbErr(e){sync='err';console.error(e);softRender()}
function cQ(q){if(db)db.collection('visaprep_questions').doc(q.id).set({text:q.text,by:q.by||'',answers:q.answers||{},about:q.about||'',created:q.created||Date.now()}).catch(fbErr)}
function cK(f){if(db)db.collection('visaprep_tech').doc(f.id).set({text:f.text,answer:f.answer,by:f.by||'',created:f.created||Date.now()}).catch(fbErr)}
function cT(t){if(db)db.collection('visaprep_tests').doc(t.id).set(t).catch(fbErr)}
function rr(k,arr){var j=JSON.stringify(arr),ch=lastJ[k]!==j||shownSync!==sync;lastJ[k]=j;shownSync=sync;if(ch)softRender()}
function softRender(){
  if(bulk)return;
  var el=document.activeElement,id=el&&el.id,ss=el&&el.selectionStart,se=el&&el.selectionEnd,vals={};
  document.querySelectorAll('textarea,input').forEach(function(t){if(t.id)vals[t.id]=t.value});
  render();
  for(var k in vals){var t=$(k);if(t)t.value=vals[k]}
  if(id&&$(id)){$(id).focus();try{$(id).setSelectionRange(ss,se)}catch(e){}}
}
function initFB(){
  if(!FB_CONFIG.apiKey||typeof firebase==='undefined')return;
  try{
    firebase.initializeApp(FB_CONFIG);db=firebase.firestore();
    db.collection('visaprep_questions').onSnapshot(function(snap){
      var arr=[];snap.forEach(function(d){var x=d.data();x.id=d.id;x.answers=x.answers||{};arr.push(x)});
      if(snap.metadata.fromCache&&!arr.length)return;
      if(first.q&&!arr.length&&S.questions.length){S.questions.forEach(function(q,i){q.created=q.created||Date.now()+i;cQ(q)})}
      else{arr.sort(function(a,b){return (a.created||0)-(b.created||0)});S.questions=arr}
      first.q=false;sync='live';save();rr('q',arr);
    },fbErr);
    db.collection('visaprep_tests').onSnapshot(function(snap){
      var arr=[];snap.forEach(function(d){var x=d.data();x.id=d.id;arr.push(x)});
      if(snap.metadata.fromCache&&!arr.length)return;
      if(first.t&&!arr.length&&S.tests.length){S.tests.forEach(cT)}
      else{arr.sort(function(a,b){return a.date<b.date?-1:1});S.tests=arr}
      first.t=false;save();rr('t',arr);
    },fbErr);
    db.collection('visaprep_tech').onSnapshot(function(snap){
      var arr=[];snap.forEach(function(d){var x=d.data();x.id=d.id;arr.push(x)});
      if(snap.metadata.fromCache&&!arr.length)return;
      if(first.k&&!arr.length&&S.tech.length){S.tech.forEach(function(f,i){f.created=f.created||Date.now()+i;cK(f)})}
      else{arr.sort(function(a,b){return (a.created||0)-(b.created||0)});S.tech=arr}
      first.k=false;save();rr('k',arr);
    },fbErr);
  }catch(e){fbErr(e)}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function other(){return user==='Tom'?'Yoni':'Tom'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(id){return document.getElementById(id)}
function getQ(id){return S.questions.filter(function(x){return x.id===id})[0]}
function login(n){anim=true;user=n;try{localStorage.setItem(UKEY,n)}catch(e){}tab='q';run=null;render()}
function logout(){user=null;try{localStorage.removeItem(UKEY)}catch(e){}run=null;render()}
function setTab(t){anim=true;tab=t;run=null;trun=null;bulk=null;histWho=null;render()}
function syncLbl(){return sync==='live'?'🟢 Live':sync==='err'?'🔴 Offline':'⚪ Local only'}

var BK='<svg class="stack" viewBox="0 0 150 110" aria-hidden="true"><rect x="16" y="76" width="122" height="28" rx="9" fill="#3F8A82"/><rect x="26" y="50" width="104" height="28" rx="9" fill="#7A5FA8"/><rect x="10" y="24" width="112" height="28" rx="9" fill="#F4E3CF"/><rect x="26" y="86" width="70" height="5" rx="2.5" fill="#fff" opacity=".35"/><rect x="38" y="60" width="52" height="5" rx="2.5" fill="#fff" opacity=".35"/><path d="M104 24h14v38l-7-6-7 6z" fill="#F4B24A"/></svg>';
function ic(p){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
var IC={q:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',p:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',t:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',h:'<path d="M18 20V10M12 20V4M6 20v-6"/>'};
var HEAD={q:['Questions','Write your own answers and read your partner’s.'],p:['Practice','Answer from memory, then compare.'],h:['History','Every test, both of you.'],t:['Technical','Short facts — dates, names, numbers — for speed rounds.']};
function render(){
  var a=$('app');a.className='app'+(anim?' anim':'');anim=false;
  if(!user){
    a.innerHTML='<div class="landing"><div class="hero"><span class="chip">Marriage visa interview</span><h1>Visa Interview Prep</h1><p>Practice together and build calm, consistent answers about your relationship.</p>'+BK+'</div><div class="sheet"><div class="card"><h2 style="font:800 1.6rem var(--disp);margin:0">Who’s practicing?</h2><p class="mu" style="margin:4px 0 0">Choose your profile to continue.</p><div class="who"><button class="t" onclick="login(\'Tom\')"><i>T</i>Tom</button><button class="y" onclick="login(\'Yoni\')"><i>Y</i>Yoni</button></div><ul class="feat"><li><b>Write</b> your own answers to every question.</li><li><b>Practice</b> against your partner’s answers.</li><li><b>Review</b> each other’s full test history.</li></ul></div></div></div>';
    return;
  }
  var h='<div class="hero"><div class="top"><span class="av">'+user[0]+'</span><span class="hi">Hi, '+user+'!</span><span class="chip">'+syncLbl()+'</span><button class="chip" onclick="logout()">Switch</button></div><h1>'+HEAD[tab][0]+'</h1><p>'+HEAD[tab][1]+'</p>'+BK+'</div><div class="sheet t-'+tab+'" id="view"></div>';
  h+='<div class="nav"><div class="brand"><b>V</b><span>Visa Interview Prep</span></div>';
  [['q','Questions'],['p','Practice'],['t','Technical'],['h','History']].forEach(function(t){h+='<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+ic(IC[t[0]])+'<span>'+t[1]+'</span></button>'});
  h+='<div class="side"><b>👤 '+user+'</b><span class="mu">'+syncLbl()+'</span><button class="s" onclick="logout()">Switch user</button></div></div>';
  if(tab==='q'||tab==='t')h+='<button class="fab" aria-label="Add" onclick="adding=tab;render()">+</button>';
  if(adding){var T=adding==='t';h+='<div class="modal" onclick="if(event.target===this){adding=false;render()}"><div class="in"><h2 style="font:800 1.6rem var(--disp);margin:0 0 10px">'+(T?'Add technical facts':'Add questions')+'</h2>'+'<p class="mu" style="margin:0 0 8px">'+(T?'One per line: <b>Question | Answer</b> (the answer can be added later).':'One per line. Start a line with <b>[Tom]</b> or <b>[Yoni]</b> if it is about one person only.')+'</p>'+'<textarea id="nq" placeholder="'+(T?'Wedding date | 14 June 2023':'One question per line')+'"></textarea><div class="row"><button class="b" onclick="addQ()">Add</button><button class="s" onclick="adding=false;render()">Cancel</button></div></div></div>'}
  if(bulk){var arr=list(bulk);h+='<div class="modal" onclick="if(event.target===this){bulk=null;render()}"><div class="in wide"><h2 style="font:800 1.6rem var(--disp);margin:0 0 4px">'+(bulk==='q'?'Edit all questions':'Edit all facts')+'</h2><p class="mu" style="margin:0 0 6px">Change any text, or tap ✕ to remove an item. Nothing is saved until you press Save.</p><div id="bl">';
    arr.forEach(function(x){h+='<div class="brow" data-id="'+x.id+'"><input class="bt" value="'+esc(x.text)+'">'+(bulk==='t'?'<input class="ba" value="'+esc(x.answer)+'">':'<select class="bs"><option value="">Both</option>'+NAMES.map(function(n){return '<option value="'+n+'"'+(x.about===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select>')+'<button class="s" onclick="this.parentNode.classList.toggle(\'rm\')">✕</button></div>'});
    h+='</div><div class="row"><button class="b" onclick="saveBulk()">Save changes</button><button class="s" onclick="bulk=null;render()">Cancel</button></div></div></div>'}
  a.innerHTML=h;
  ({q:viewQ,p:viewP,h:viewH,t:viewT})[tab]();
  if(adding&&$('nq'))$('nq').focus();
}

function viewQ(){
  var v=$('view'),o=other(),h='';
  if(!S.questions.length)h='<div class="card full"><b>No questions yet.</b><p class="mu">Tap the + to paste in your list.</p></div>';
  else h='<div class="card full" style="padding:12px 18px"><div class="row sp" style="margin:0"><span class="mu">'+S.questions.length+' question'+(S.questions.length>1?'s':'')+'</span><button class="s" onclick="bulk=\'q\';render()">✏️ Edit all questions</button></div></div>';
  S.questions.forEach(function(q){
    var theirs=q.answers[o]||'',sub=q.about&&q.about!==user,tg=sub?'About '+q.about:q.about?'About you':'';
    if(!sub)tg+=(tg&&q.answers[user]?' · ':'')+(q.answers[user]?'Answered':(tg?'':'To answer'));
    var sel='<select onchange="setAbout(\''+q.id+'\',this.value)" aria-label="Who is it about"><option value="">About both</option>'+NAMES.map(function(n){return '<option value="'+n+'"'+(q.about===n?' selected':'')+'>About '+n+'</option>'}).join('')+'</select>';
    h+='<div class="card rb'+(q.answers[user]||sub?' done':'')+'"><span class="tag">'+tg+'</span><div class="qt">'+esc(q.text)+'</div>'
    +(sub?'<p class="mu" style="margin:0">Only '+q.about+' answers this one — you’ll be tested on it.</p>':'<div class="lbl">Your answer</div><textarea id="a'+q.id+'" placeholder="Write your answer…">'+esc(q.answers[user]||'')+'</textarea>')
    +'<div class="row">'+(sub?'':'<button class="b" onclick="saveA(\''+q.id+'\',this)">Save answer</button>')+'<button class="s" onclick="editQ(\''+q.id+'\')">Edit question</button><button class="s" onclick="delQ(\''+q.id+'\')">Delete</button>'+sel+'</div>'
    +(q.about&&!sub?'':'<details><summary>'+o+'’s answer'+(theirs?'':' (none yet)')+'</summary><div class="box">'+(theirs?esc(theirs):'—')+'</div></details>')+'</div>';
  });
  v.innerHTML=h;
}
function setAbout(id,v){var q=getQ(id);q.about=v;save();if(db)db.collection('visaprep_questions').doc(id).update({about:v}).catch(fbErr);render()}
function addQ(){
  var k=adding==='t'?'t':'q',n=0,skip=0;
  $('nq').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){
    var c=Date.now()+n++;
    if(k==='q'){var m=x.match(/^\[(tom|yoni)\]\s*/i),ab=m?(m[1].toLowerCase()==='tom'?'Tom':'Yoni'):'',tx=m?x.slice(m[0].length):x;if(!tx){skip++;return}var q={id:uid(),text:tx,by:user,about:ab,answers:{},created:c};S.questions.push(q);cQ(q)}
    else{var d=x.indexOf('|'),pr=d<0?x:x.slice(0,d).trim(),an=d<0?'':x.slice(d+1).trim();if(!pr){skip++;return}var f={id:uid(),text:pr,answer:an,by:user,created:c};S.tech.push(f);cK(f)}
  });
  adding=false;save();render();
  if(skip)alert(skip+' empty line(s) skipped.');
}
function saveA(id,b){var v=$('a'+id).value.trim();getQ(id).answers[user]=v;save();if(db){var u={};u['answers.'+user]=v;db.collection('visaprep_questions').doc(id).update(u).catch(fbErr)}b.textContent='Saved ✓';setTimeout(function(){b.textContent='Save answer'},1200)}
function editQ(id){var q=getQ(id),t=prompt('Edit question',q.text);if(t&&t.trim()){q.text=t.trim();save();if(db)db.collection('visaprep_questions').doc(id).update({text:q.text}).catch(fbErr);render()}}
function delQ(id){if(confirm('Delete this question and both answers?')){S.questions=S.questions.filter(function(x){return x.id!==id});save();if(db)db.collection('visaprep_questions').doc(id).delete().catch(fbErr);render()}}

function pool(){var o=other();return S.questions.filter(function(q){return (q.answers[o]||'').trim()&&(!q.about||q.about===o)})}
function viewP(){
  var v=$('view'),o=other();
  if(!run){
    var p=pool();
    if(!p.length){v.innerHTML='<div class="card"><b>Nothing to practice yet.</b><p class="mu">'+o+' needs to save at least one answer in Questions.</p></div>';return}
    v.innerHTML='<div class="big red"><span class="tag">'+p.length+' available</span><h2>Test yourself against '+o+'’s answers</h2><label>How many questions?</label><input id="cnt" type="number" min="1" max="'+p.length+'" value="'+Math.min(10,p.length)+'"><div class="row"><button class="b" onclick="startT()">Start test</button></div></div>';
    return;
  }
  if(run.i>=run.items.length){
    var ok=run.items.filter(function(x){return x.ok}).length;
    v.innerHTML='<div class="big grn"><span class="tag">Finished</span><h2>You got '+ok+' of '+run.items.length+'</h2><div class="row"><button class="b" onclick="run=null;render()">New test</button><button onclick="setTab(\'h\')">See history</button></div></div>';
    return;
  }
  var it=run.items[run.i];
  var h='<div class="big blue"><span class="tag">Question '+(run.i+1)+' of '+run.items.length+(it.ab?' · About '+it.ab:'')+'</span><h2>'+esc(it.q)+'</h2>';
  if(!run.shown)h+='<textarea id="ans" placeholder="Type your answer…"></textarea><div class="row"><button class="b" onclick="check()">Check answer</button></div></div>';
  else h+='</div><div class="card"><div class="cmp"><div><div class="lbl">Your answer</div><div class="box">'+(esc(it.mine)||'—')+'</div></div><div><div class="lbl">'+other()+'’s answer</div><div class="box">'+esc(it.ref)+'</div></div></div><p class="lbl">Was your answer correct?</p><div class="row"><button class="bo" onclick="mark(true)">Correct</button><button class="bn" onclick="mark(false)">Incorrect</button></div></div>';
  v.innerHTML=h+'<div class="row"><button class="s" onclick="if(confirm(\'Quit this test?\')){run=null;render()}">Quit test</button></div>';
}
function startT(){
  var p=pool(),n=Math.max(1,Math.min(p.length,parseInt($('cnt').value)||1)),o=other();
  for(var i=p.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=p[i];p[i]=p[j];p[j]=t}
  run={i:0,shown:false,items:p.slice(0,n).map(function(q){return{qid:q.id,q:q.text,ab:q.about||'',ref:q.answers[o],mine:'',ok:null}})};
  render();
}
function check(){run.items[run.i].mine=$('ans').value.trim();run.shown=true;render()}
function mark(ok){
  run.items[run.i].ok=ok;run.i++;run.shown=false;
  if(run.i>=run.items.length){var t={id:uid(),user:user,vs:other(),date:new Date().toISOString(),items:run.items};S.tests.push(t);save();cT(t)}
  render();
}

function col(k){return k==='q'?'visaprep_questions':'visaprep_tech'}
function list(k){return k==='q'?S.questions:S.tech}
function getI(k,id){return list(k).filter(function(x){return x.id===id})[0]}
function saveBulk(){
  var k=bulk,rows=[].slice.call(document.querySelectorAll('#bl .brow')),del=rows.filter(function(r){return r.classList.contains('rm')});
  if(del.length&&!confirm('Remove '+del.length+' item'+(del.length>1?'s':'')+(k==='q'?' and their answers':'')+'?'))return;
  rows.forEach(function(r){
    var id=r.dataset.id,it=getI(k,id);if(!it)return;
    if(r.classList.contains('rm')){if(k==='q')S.questions=S.questions.filter(function(x){return x.id!==id});else S.tech=S.tech.filter(function(x){return x.id!==id});if(db)db.collection(col(k)).doc(id).delete().catch(fbErr);return}
    var t=r.querySelector('.bt').value.trim(),a=k==='t'?r.querySelector('.ba').value.trim():'',ab=k==='q'?r.querySelector('.bs').value:'';
    if(!t)return;
    if(t!==it.text||(k==='t'&&a!==it.answer)||(k==='q'&&ab!==(it.about||''))){it.text=t;var u={text:t};if(k==='t'){it.answer=a;u.answer=a}if(k==='q'){it.about=ab;u.about=ab}if(db)db.collection(col(k)).doc(id).update(u).catch(fbErr)}
  });
  bulk=null;save();render();
}
function delTest(id){if(!confirm('Delete this test from history?'))return;S.tests=S.tests.filter(function(t){return t.id!==id});save();if(db)db.collection('visaprep_tests').doc(id).delete().catch(fbErr);render()}
function clearTests(w){var ids=S.tests.filter(function(t){return t.user===w}).map(function(t){return t.id});if(!ids.length||!confirm('Delete all '+ids.length+' of '+w+'’s tests? This cannot be undone.'))return;S.tests=S.tests.filter(function(t){return t.user!==w});save();if(db)ids.forEach(function(id){db.collection('visaprep_tests').doc(id).delete().catch(fbErr)});render()}

function norm(s){return String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()}
function fmtT(n){return n>=60?Math.floor(n/60)+'m '+(n%60)+'s':n+'s'}
function editT(id){var f=getI('t',id),p=prompt('Edit question',f.text);if(!p||!p.trim())return;var a=prompt('Edit answer',f.answer);if(!a||!a.trim())return;f.text=p.trim();f.answer=a.trim();save();if(db)db.collection('visaprep_tech').doc(id).update({text:f.text,answer:f.answer}).catch(fbErr);render()}
function delT(id){if(confirm('Delete this fact?')){S.tech=S.tech.filter(function(x){return x.id!==id});save();if(db)db.collection('visaprep_tech').doc(id).delete().catch(fbErr);render()}}
function viewT(){
  var v=$('view'),h;
  if(trun){
    if(trun.i>=trun.items.length){
      var ok=trun.items.filter(function(x){return x.ok}).length,miss=trun.items.filter(function(x){return !x.ok});
      v.innerHTML='<div class="big grn full"><span class="tag">Round finished</span><h2>'+ok+' of '+trun.items.length+' · '+fmtT(trun.secs)+'</h2><div class="row"><button class="b" onclick="trun=null;render()">New round</button><button onclick="setTab(\'h\')">See history</button></div></div>'+(miss.length?'<div class="card full"><b>To review</b>'+miss.map(function(x){return '<div class="box"><b>'+esc(x.q)+'</b>\n'+esc(x.ref)+'</div>'}).join('')+'</div>':'');
      return;
    }
    var it=trun.items[trun.i];
    h='<div class="big blue full"><span class="tag">Fact '+(trun.i+1)+' of '+trun.items.length+'</span><h2>'+esc(it.q)+'</h2>';
    if(!trun.shown)h+='<input id="tans" autocomplete="off" placeholder="Type your answer, press Enter" onkeydown="if(event.key===\'Enter\'){event.preventDefault();tCheck()}"><div class="row"><button class="b" onclick="tCheck()">Check</button></div></div>';
    else h+='<span class="res" style="background:'+(it.ok?'var(--green)':'var(--red)')+'">'+(it.ok?'Correct':'Not quite')+'</span><div class="box"><b>'+esc(it.ref)+'</b>'+(it.ok?'':'\nYou wrote: '+(esc(it.mine)||'—'))+'</div><div class="row"><button class="b" id="tnext" onclick="tNext()">Next ▶</button>'+(it.ok?'':'<button onclick="trun.items[trun.i].ok=true;tNext()">I was right</button>')+'</div></div>';
    v.innerHTML=h+'<div class="row full"><button class="s" onclick="if(confirm(\'Quit this round?\')){trun=null;render()}">Quit round</button></div>';
    setTimeout(function(){var e=$('tans')||$('tnext');if(e)e.focus()},30);
    return;
  }
  var rd=S.tech.filter(function(f){return f.answer});
  h='<div class="big blue full"><span class="tag">⚡ Speed round</span><h2>'+(rd.length?'Drill your facts':S.tech.length?'Add answers first':'No facts yet')+'</h2>';
  if(rd.length)h+='<label>How many facts?</label><input id="tcnt" type="number" min="1" max="'+rd.length+'" value="'+Math.min(10,rd.length)+'"><div class="row"><button class="b" onclick="startTech()">Start round</button><button onclick="bulk=\'t\';render()">✏️ Edit all</button></div>';
  else if(S.tech.length)h+='<p style="margin:0">Facts without an answer can’t be practiced yet.</p><div class="row"><button class="b" onclick="bulk=\'t\';render()">✏️ Edit all</button></div>';
  else h+='<p style="margin:0">Tap the + and add lines like: <b>Wedding date | 14 June 2023</b></p>';
  h+='</div>';
  S.tech.forEach(function(f){h+='<div class="card"><div class="qt" style="margin:0 0 8px">'+esc(f.text)+'</div><div class="box">'+(f.answer?esc(f.answer):'<span class="mu">No answer yet — use ✏️ Edit all</span>')+'</div><div class="row"><button class="s" onclick="editT(\''+f.id+'\')">Edit</button><button class="s" onclick="delT(\''+f.id+'\')">Delete</button></div></div>'});
  v.innerHTML=h;
}
function startTech(){
  var p=S.tech.filter(function(f){return f.answer}),n=Math.max(1,Math.min(p.length,parseInt($('tcnt').value)||1));
  for(var i=p.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=p[i];p[i]=p[j];p[j]=t}
  trun={i:0,shown:false,start:Date.now(),items:p.slice(0,n).map(function(f){return{qid:f.id,q:f.text,ref:f.answer,mine:'',ok:null}})};render();
}
function tCheck(){var it=trun.items[trun.i];it.mine=$('tans').value.trim();it.ok=!!norm(it.mine)&&norm(it.mine)===norm(it.ref);trun.shown=true;render()}
function tNext(){
  trun.i++;trun.shown=false;
  if(trun.i>=trun.items.length){trun.secs=Math.round((Date.now()-trun.start)/1000);var t={id:uid(),user:user,vs:'Technical',kind:'tech',secs:trun.secs,date:new Date().toISOString(),items:trun.items};S.tests.push(t);save();cT(t)}
  render();
}
function viewH(){
  var v=$('view'),w=histWho||user;
  var h='<div class="seg"><button class="'+(w===user?'on':'')+'" onclick="histWho=user;render()">My tests</button><button class="'+(w!==user?'on':'')+'" onclick="histWho=other();render()">'+other()+'’s tests</button></div>';
  var ts=S.tests.filter(function(t){return t.user===w}).reverse();
  if(!ts.length)h+='<div class="card"><b>No tests yet.</b></div>';
  else h+='<div class="row sp" style="margin:0 4px 4px"><span class="mu">'+ts.length+' test'+(ts.length>1?'s':'')+'</span><button class="s" onclick="clearTests(\''+w+'\')">Delete all of '+esc(w)+'’s tests</button></div>';
  ts.forEach(function(t){
    var ok=t.items.filter(function(x){return x.ok}).length;
    h+='<div class="card"><details open><summary style="margin:0;color:var(--ink)"><b>'+esc(new Date(t.date).toLocaleString())+'</b>'+(t.kind==='tech'?' ⚡ Speed round'+(t.secs?' · '+fmtT(t.secs):''):'')+' &nbsp;<span class="res" style="background:'+(ok===t.items.length?'var(--green)':'var(--orange)')+'">'+ok+' / '+t.items.length+'</span></summary>';
    t.items.forEach(function(x){
      h+='<div style="margin-top:16px"><div class="row sp" style="margin:0"><b>'+esc(x.q)+'</b><span class="res" style="background:'+(x.ok?'var(--green)':'var(--red)')+'">'+(x.ok?'Correct':'Incorrect')+'</span></div><div class="cmp"><div><div class="lbl">'+esc(t.user)+'’s answer</div><div class="box">'+(esc(x.mine)||'—')+'</div></div><div><div class="lbl">'+(t.kind==='tech'?'Correct answer':esc(t.vs)+'’s answer')+'</div><div class="box">'+esc(x.ref)+'</div></div></div></div>';
    });
    h+='</details><div class="row"><button class="s" onclick="delTest(\''+t.id+'\')">🗑 Delete this test</button></div></div>';
  });
  v.innerHTML=h;
}
initFB();
render();
</script>
